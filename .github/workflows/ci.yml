# Builds every component and runs both test suites, on each system Ouro is used on.
# The benchmarks are built, so they keep compiling, but not run: a shared runner's
# timings are too noisy to compare (see the spec's Appendix C for how they are recorded).
# A second job checks that the generated files match the scripts and tables they come from.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lib/aat/ is generated from scripts/aat/'s tables, and the fixtures' Getty labels are
  # corrected by scripts/fixtures/relabel.pl: both are run again, and any change they make
  # means a table or a script was edited without regenerating. Perl and git only, no network.
  generated:
    name: generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the aat modules
        run: perl scripts/aat/generate.pl scripts/aat/recommended.tsv scripts/aat/examples.tsv lib/aat

      - name: Relabel the fixtures
        run: perl scripts/fixtures/relabel.pl scripts/fixtures/labels.tsv test/fixtures/json/*.json

      - name: Nothing changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated files are out of date: run scripts/aat/generate.pl and scripts/fixtures/relabel.pl, and commit what they change."
            exit 1
          fi

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and cabal
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: 'latest'
          cabal-update: true

      # The build plan, whose hash keys the cache of built dependencies
      - name: Plan
        run: cabal build all --enable-tests --enable-benchmarks --dry-run

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-9.10.3-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-9.10.3-

      - name: Build dependencies
        run: cabal build all --enable-tests --enable-benchmarks --only-dependencies

      - name: Save dependencies
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Ouro's own code builds without a warning, and CI keeps it so
      - name: Build
        run: cabal build all --enable-tests --enable-benchmarks --ghc-options=-Werror

      - name: The compiler's tests
        run: cabal test ouro-test --enable-tests --enable-benchmarks --ghc-options=-Werror --test-show-details=direct

      - name: The command line's tests
        run: cabal test ouro-cli-test --enable-tests --enable-benchmarks --ghc-options=-Werror --test-show-details=direct
